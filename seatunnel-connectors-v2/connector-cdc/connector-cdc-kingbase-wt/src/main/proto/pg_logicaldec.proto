package decoderbufs;

option java_package = "io.debezium.connector.kingbase.proto";
option java_outer_classname = "PgProto";
option optimize_for = SPEED;

// This schema intentionally uses proto2 default syntax to match the
// generated PgProto descriptor consumed by the Kingbase decoderbufs stream.
message Point {
  required double x = 1;
  required double y = 2;
}

message DatumMessage {
  optional string column_name = 1;
  optional int64 column_type = 2;

  oneof datum {
    int32 datum_int32 = 3;
    int64 datum_int64 = 4;
    float datum_float = 5;
    double datum_double = 6;
    bool datum_bool = 7;
    string datum_string = 8;
    bytes datum_bytes = 9;
    Point datum_point = 10;
    bool datum_missing = 11;
  }
}

message TypeInfo {
  required string modifier = 1;
  required bool value_optional = 2;
}

message RowMessage {
  optional uint32 transaction_id = 1;
  optional uint64 commit_time = 2;
  optional string schema = 3;
  optional string table = 4;
  optional Op op = 5;
  repeated DatumMessage new_tuple = 6;
  repeated DatumMessage old_tuple = 7;
  repeated TypeInfo new_typeinfo = 8;
  optional uint64 current_lsn = 9;
  optional uint64 oldest_lsn = 10;
  optional uint64 end_lsn = 11;
}

enum Op {
  UNKNOWN = -1;
  INSERT = 0;
  UPDATE = 1;
  DELETE = 2;
  BEGIN = 3;
  COMMIT = 4;
}
