# SnowflakeFile Sink Parquet 格式示例配置
# 该配置演示如何使用 Parquet 格式将数据写入 Snowflake

env {
  execution.parallelism = 2
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake_data"
    row.num = 10000
    schema = {
      fields {
        user_id = "bigint"
        user_name = "string"
        email = "string"
        age = "int"
        salary = "double"
        created_at = "timestamp"
        is_active = "boolean"
      }
    }
  }
}

sink {
  SnowflakeFile {
    # Snowflake 连接配置
    account = "your_account"
    warehouse = "COMPUTE_WH"
    database = "ANALYTICS_DB"
    schema = "USER_DATA"
    table = "user_profiles"
    user = "your_user"
    password = "your_password"

    # AWS S3 配置
    s3_bucket = "your-analytics-bucket"
    s3_region = "us-west-2"
    s3_key_prefix = "snowflake-staging/user-data/"
    aws_access_key_id = "your_aws_access_key"
    aws_secret_access_key = "your_aws_secret_key"

    # Parquet 格式配置
    file_format = "PARQUET"
    file_extension = ".parquet"
    max_file_size = 268435456  # 256MB

    # 性能优化
    buffer_size = 4194304      # 4MB
    purge_after_copy = true

    # Snowflake COPY 选项
    copy_options = {
      "ON_ERROR" = "SKIP_FILE_3"
      "FORCE" = "TRUE"
      "TRIM_SPACE" = "TRUE"
      "NULL_IF" = "('')"
    }
  }
}