# SnowflakeFile Sink 示例配置
# 该配置演示如何使用 SnowflakeFile 连接器将数据写入 Snowflake
# 数据首先被写入 Amazon S3，然后通过 Snowflake 的 COPY INTO 命令加载到目标表

env {
  # 设置执行模式
  execution.parallelism = 1
  job.mode = "BATCH"
}

source {
  # 使用 Fake 源生成测试数据
  FakeSource {
    plugin_output = "fake_data"
    row.num = 1000
    schema = {
      fields {
        id = "int"
        name = "string"
        age = "int"
        salary = "double"
        create_time = "timestamp"
      }
    }
    rows = [
      {fields = [1, "Alice", 25, 5000.0, "2024-01-01 10:00:00"], kind = "INSERT"}
      {fields = [2, "Bob", 30, 6000.0, "2024-01-01 11:00:00"], kind = "INSERT"}
      {fields = [3, "Charlie", 35, 7000.0, "2024-01-01 12:00:00"], kind = "INSERT"}
    ]
  }
}

transform {
  # 可选的转换步骤
  # 这里可以添加数据转换逻辑
}

sink {
  SnowflakeFile {
    # Snowflake 连接配置
    account = "your_account"
    warehouse = "COMPUTE_WH"
    database = "TEST_DB"
    schema = "PUBLIC"
    table = "employees"
    user = "your_user"
    password = "your_password"
    role = "SYSADMIN"  # 可选

    # AWS S3 配置
    staging_backend = "S3"
    s3_bucket = "your-s3-bucket"
    s3_region = "us-east-1"
    s3_key_prefix = "snowflake-staging/employees/"
    aws_access_key_id = "your_aws_access_key"
    aws_secret_access_key = "your_aws_secret_key"

    # 文件格式配置
    file_format = "CSV"
    field_delimiter = ","      # CSV 字段分隔符
    record_delimiter = "\n"    # 记录分隔符
    file_extension = ".csv"    # 文件扩展名

    # 性能配置
    buffer_size = 1048576      # 缓冲区大小 (1MB)
    max_file_size = 104857600  # 最大文件大小 (100MB)

    # COPY 选项
    purge_after_copy = true    # 复制完成后是否删除 S3 文件

    # 时间格式配置
    time_format = "HH24:MI:SS"
    date_format = "YYYY-MM-DD"
    timestamp_format = "YYYY-MM-DD HH24:MI:SS.FF3"

    # 额外的 COPY 选项（可选）
    copy_options = {
      "ON_ERROR" = "CONTINUE"
      "FORCE" = "TRUE"
    }

    # 如果需要使用现有的 Snowflake 文件格式，可以指定名称
    # snowflake_file_format_name = "MY_CSV_FORMAT"
  }

  # Local file staging 示例
  # SnowflakeFile {
  #   account = "your_account"
  #   warehouse = "COMPUTE_WH"
  #   database = "TEST_DB"
  #   schema = "PUBLIC"
  #   table = "employees"
  #   user = "your_user"
  #   password = "your_password"
  #
  #   staging_backend = "LOCAL_FILE"
  #   local_stage_type = "USER"
  #   local_stage_prefix = "seatunnel-local"
  #   local_temp_dir = "/tmp/seatunnel-snowflake-file"
  #
  #   file_format = "CSV"
  #   field_delimiter = ","
  #   record_delimiter = "\n"
  #   file_extension = ".csv"
  #   purge_after_copy = true
  # }
}
