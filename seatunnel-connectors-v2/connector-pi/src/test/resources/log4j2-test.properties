################################################################################
#  PI WebSocket Test Log Configuration
################################################################################

# Enable console output for test log observation
rootLogger.level = INFO
rootLogger.appenderRef.console.ref = consoleAppender

# PI Connector detailed logs
logger.piConnector.name = org.apache.seatunnel.connectors.seatunnel.pi
logger.piConnector.level = DEBUG

# WebSocket client detailed logs
logger.piWebSocket.name = org.apache.seatunnel.connectors.seatunnel.pi.client
logger.piWebSocket.level = DEBUG

# Console output configuration
appender.console.name = consoleAppender
appender.console.type = CONSOLE
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %c(%L) [%t] - %m%n

# Also output to file (optional)
rootLogger.appenderRef.file.ref = fileAppender
appender.file.name = fileAppender
appender.file.type = RollingFile
appender.file.fileName = /tmp/seatunnel/logs/pi-test.log
appender.file.filePattern = /tmp/seatunnel/logs/pi-test.log.%d{yyyy-MM-dd}-%i
appender.file.append = true
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%-30.30c{1.}] [%t] - %m%n
appender.file.policies.type = Policies
appender.file.policies.time.type = TimeBasedTriggeringPolicy
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 10MB
