env {
    execution.parallelism = 1
    job.mode = "BATCH"
}

source {
    FakeSource {
        plugin_output = "informix_test_source"
        row.num = 5
        schema = {
            table = "informix.seatunnel_engine_test"
            fields {
                id = "int"
                test_decimal = "decimal(10,2)"
                test_double = "double"
                test_varchar = "string"
                test_timestamp = "timestamp"
                test_boolean = "boolean"
            }
        }
        rows = [
            {
                kind = INSERT
                fields = [1, 123.45, 678.901234567890, "Test String 1", "2023-12-25T10:30:45", true]
            },
            {
                kind = INSERT  
                fields = [2, 999.99, -123.456789012345, "测试中文字符串", "2023-12-26T11:45:30", false]
            },
            {
                kind = INSERT
                fields = [3, 0.01, 0.0, "", "2023-12-27T00:00:00", true]
            },
            {
                kind = INSERT
                fields = [4, -456.78, 999999.999999999999, "Special chars: !@#$%^&*()", "2023-12-28T23:59:59", false]
            },
            {
                kind = INSERT
                fields = [5, 789.12, 1.23456789E10, "Long text for testing VARCHAR to TEXT conversion in Informix database", "2023-12-29T12:00:00", true]
            }
        ]
    }
}

sink {
    Jdbc {
        plugin_input = "informix_test_source"

        # Informix connection configuration
        url = "jdbc:informix-sqli://datasource01:9088/testutf8db:INFORMIXSERVER=informix;DB_LOCALE=en_us.utf8;CLIENT_LOCALE=en_us.utf8;"
        driver = "com.informix.jdbc.IfxDriver"
        user = "informix"
        password = "in4mix"
        
        # Database and table configuration - explicitly specify full path
        database = "testutf8db"
        table = "informix.seatunnel_engine_test"
        
        # Save mode configuration
        schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
        data_save_mode = "APPEND_DATA"

        # Auto-generate sink SQL statement
        generate_sink_sql = true

        # Batch processing configuration
        batch_size = 1
        batch_interval_ms = 1000

        # Connection configuration
        connection_check_timeout_sec = 30
        max_retries = 3

        # Transaction configuration
        is_exactly_once = false

        # Informix specific configuration - maintain original column name definitions (uppercase, lowercase, mixed) from database without transformation
        field_ide = "ORIGINAL"
        
        # Informix character encoding and connection properties configuration - remove locale settings to let system auto-match
        properties {
            IFXHOST = "datasource01"
            DBSPACETEMP = "temp"
            IFX_USEPUT = "1"
        }
        primary_keys = ["id"]
    }
}