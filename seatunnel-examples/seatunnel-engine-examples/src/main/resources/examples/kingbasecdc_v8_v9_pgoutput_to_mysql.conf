######
###### This config demonstrates a single SeaTunnel streaming job
###### capturing Kingbase V9 and Kingbase V8 simultaneously through pgoutput
###### and writing both streams into MySQL.
######
###### Notes:
###### 1. Replace the JDBC endpoints, credentials, table names and sink tables
######    with values from your environment before running.
###### 2. Each source must use its own slot.name and publication.name.
###### 3. For update/delete capture, the source tables should enable
######    REPLICA IDENTITY FULL.
######
env {
  "job.name" = "kingbase_v8_v9_pgoutput_to_mysql"
  "job.mode" = STREAMING
  "checkpoint.interval" = 5000
  parallelism = 1
}

source {
  Kingbase-CDC {
    result_table_name = "kingbase_v9_src"
    base-url = "jdbc:kingbase8://127.0.0.1:54321/test"
    username = "system"
    password = "replace_with_v9_password"
    database-names = ["test"]
    table-names = ["test.public.kingbase_v9_cdc_sample"]
    "startup.mode" = INITIAL
    "stop.mode" = NEVER
    "slot.name" = "kingbase_v9_pgoutput_slot"
    "server-time-zone" = "Asia/Shanghai"
    "snapshot.split.size" = 2
    debezium = {
      "publication.name" = "kingbase_v9_pgoutput_pub"
      "publication.autocreate.mode" = "filtered"
    }
  }

  Kingbase-CDC {
    result_table_name = "kingbase_v8_src"
    base-url = "jdbc:kingbase8://127.0.0.1:54322/test"
    username = "system"
    password = "replace_with_v8_password"
    database-names = ["test"]
    table-names = ["test.public.kingbase_v8_cdc_sample"]
    "startup.mode" = INITIAL
    "stop.mode" = NEVER
    "slot.name" = "kingbase_v8_pgoutput_slot"
    "server-time-zone" = "Asia/Shanghai"
    "snapshot.split.size" = 2
    debezium = {
      "publication.name" = "kingbase_v8_pgoutput_pub"
      "publication.autocreate.mode" = "filtered"
    }
  }
}

sink {
  Jdbc {
    source_table_name = "kingbase_v9_src"
    url = "jdbc:mysql://127.0.0.1:3306/wt_verify?useSSL=false&serverTimezone=Asia/Shanghai"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "replace_with_mysql_user"
    password = "replace_with_mysql_password"
    database = "wt_verify"
    table = "kingbase_v9_sink"
    primary_keys = ["id"]
    generate_sink_sql = true
    enable_upsert = true
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "APPEND_DATA"
  }

  Jdbc {
    source_table_name = "kingbase_v8_src"
    url = "jdbc:mysql://127.0.0.1:3306/wt_verify?useSSL=false&serverTimezone=Asia/Shanghai"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "replace_with_mysql_user"
    password = "replace_with_mysql_password"
    database = "wt_verify"
    table = "kingbase_v8_sink"
    primary_keys = ["id"]
    generate_sink_sql = true
    enable_upsert = true
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "APPEND_DATA"
  }
}
