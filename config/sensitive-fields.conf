#
# Sensitive Fields Configuration
#
# This file defines field names that should be masked/desensitized in logs and outputs.
# You can customize this list by adding or removing field names as needed.
#
# The system will load this configuration from:
#   1. External config directory: $SEATUNNEL_HOME/config/sensitive-fields.conf (priority)
#   2. Classpath resource (fallback)
#
# After modifying this file, restart SeaTunnel for changes to take effect.
#

sensitive-fields = [
    # ==================== COMMON ====================
    "password",
    "accessKey",
    "secretKey",
    "token",
    "access_key",
    "secret_key",
    "jdbc_user",
    "jdbc_password",
    "access_secret",
    "username",
    "auth",
    "user",

    # ==================== S3  ====================
    "s3.access-key-id",
    "s3.secret-access-key",
    "fs.s3a.access-key",
    "fs.s3a.secret-key",
    "session.token",

    # ==================== Paimon Hadoop  ====================
    "access-key",
    "secret-key",

    # ==================== MaxCompute ====================
    "access id",
    "accessId",
    "accesskey",

    # ==================== Kerberos  ====================
    "keytab",
    "keytab.path",
    "kerberos.keytab",
    "kerberos.keytab.path",

    # ==================== Kafka  ====================
    "kafka.password",
    "kafka.config.password",

    # ==================== ElasticSearch TLS/SSL  ====================
    "tls.keystore.path",
    "tls.keystore.password",
    "tls.truststore.password",
    "keystore.path",
    "keystore.password",
    "truststore.password",
    "ssl.keystore.path",
    "ssl.keystore.password",
    "ssl.truststore.password",

    # ==================== SSH  ====================
    "private.key",
    "private_key",
    "ssh.private.key",
]


