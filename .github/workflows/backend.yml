name: Backend
on:
  pull_request:
    pull_request_target:
      types: [ opened, reopened, synchronize ]

env:
  GH_USERNAME: ${{ secrets.GH_PACKAGE_USER }}
  GH_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-style:
    if: github.repository == 'WhaleOps/whaletunnel'
    name: Code style
    runs-on:
      labels: wtci
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: false
      - name: Check code style
        run: ./mvnw --batch-mode --settings maven-settings.xml --quiet --no-snapshot-updates clean spotless:check

  sanity-check:
    if: github.repository == 'WhaleOps/whaletunnel'
    name: Sanity check results
    needs: [ code-style ]
    runs-on:
      labels: wtci
    timeout-minutes: 30
    steps:
      - name: Check results
        run: |
          [[ ${{ needs.code-style.result }} == 'success' ]] || exit 1;

  changes:
    runs-on:
      labels: wtci_haiwai
    timeout-minutes: 30
    outputs:
      api: ${{ steps.filter.outputs.api }}
      engine: ${{ steps.filter.outputs.engine }}
      ut-modules: ${{ steps.ut-modules.outputs.modules }}
      it-modules: ${{ steps.it-modules.outputs.modules }}
      timestamp: ${{ steps.job-timestamp.outputs.timestamp }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: '2000'
      - name: Init branch name
        id: git_init
        run: |
          echo "current_branch=origin/${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
          echo "target_branch=origin/${GITHUB_BASE_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
      - name: Output Job Start Timestamp
        id: job-timestamp
        run: |
          curr_time=$(date +%s%3N)
          echo "timestamp=$curr_time" >> $GITHUB_OUTPUT
      - name: Check for file changes by python
        id: filter
        run: |
          current_branch='${{ steps.git_init.outputs.current_branch }}'
          target_branch='${{ steps.git_init.outputs.target_branch }}'
          /usr/bin/git fetch origin
          /usr/bin/git checkout $current_branch
          /usr/bin/git checkout $target_branch
          pip install GitPython
          workspace="${GITHUB_WORKSPACE}"
          cv2_files=`python3 tools/update_modules_check/check_file_updates.py ua $workspace $target_branch $current_branch "seatunnel-connectors-v2/**"`
          true_or_false=${cv2_files%%$'\n'*}
          file_list=${cv2_files#*$'\n'}
          echo "cv2=$true_or_false" >> $GITHUB_OUTPUT
          echo "cv2_files=$file_list" >> $GITHUB_OUTPUT
          
          cv2_e2e_files=`python3 tools/update_modules_check/check_file_updates.py ua $workspace $target_branch $current_branch "seatunnel-e2e/seatunnel-connector-v2-e2e/**"`
          true_or_false=${cv2_e2e_files%%$'\n'*}
          file_list=${cv2_e2e_files#*$'\n'}
          echo "cv2-e2e=$true_or_false" >> $GITHUB_OUTPUT
          echo "cv2-e2e_files=$file_list" >> $GITHUB_OUTPUT
          
          engine_files=`python3 tools/update_modules_check/check_file_updates.py ua $workspace $target_branch $current_branch "seatunnel-engine/**"`
          true_or_false=${engine_files%%$'\n'*}
          file_list=${engine_files#*$'\n'}
          echo "engine=$true_or_false" >> $GITHUB_OUTPUT
          echo "engine_files=$file_list" >> $GITHUB_OUTPUT
          
          deleted_poms_files=`python3 tools/update_modules_check/check_file_updates.py d $workspace $target_branch $current_branch "**/pom.xml"`
          true_or_false=${deleted_poms_files%%$'\n'*}
          file_list=${deleted_poms_files#*$'\n'}
          echo "deleted-poms=$true_or_false" >> $GITHUB_OUTPUT
          echo "deleted-poms_files=$file_list" >> $GITHUB_OUTPUT
          
          engine_e2e_files=`python3 tools/update_modules_check/check_file_updates.py ua $workspace $target_branch $current_branch "seatunnel-e2e/seatunnel-engine-e2e/**"`
          true_or_false=${engine_e2e_files%%$'\n'*}
          file_list=${engine_e2e_files#*$'\n'}
          echo "engine-e2e=$true_or_false" >> $GITHUB_OUTPUT
          echo "engine-e2e_files=$file_list" >> $GITHUB_OUTPUT
          
          api_files=`python3 tools/update_modules_check/check_file_updates.py ua $workspace $target_branch $current_branch "seatunnel-api/**" "seatunnel-common/**" "seatunnel-config/**" "seatunnel-connectors/**" "seatunnel-core/**" "seatunnel-e2e/seatunnel-e2e-common/**" "seatunnel-formats/**" "seatunnel-plugin-discovery/**" "seatunnel-transforms-v2/**" "seatunnel-translation/**" "seatunnel-e2e/seatunnel-transforms-v2-e2e/**" "seatunnel-connectors/**" "pom.xml" "tools/**"`
          true_or_false=${api_files%%$'\n'*}
          file_list=${api_files#*$'\n'}
          echo "api=$true_or_false" >> $GITHUB_OUTPUT
          echo "api_files=$file_list" >> $GITHUB_OUTPUT
          
          /usr/bin/git checkout $current_branch

      - name: Check Connector V2 Update
        id: cv2-modules
        if: ${{ steps.filter.outputs.cv2 == 'true' }}
        run: |
          update_files='${{ steps.filter.outputs.cv2_files }}'
          modules=`python3 tools/update_modules_check/update_modules_check.py cv2 "$update_files"`
          echo $modules
          echo "modules=$modules" >> $GITHUB_OUTPUT

      - name: Check Connector V2 E2E Update
        id: cv2-e2e-modules
        if: ${{ steps.filter.outputs.cv2-e2e == 'true' }}
        run: |
          update_files='${{ steps.filter.outputs.cv2-e2e_files }}'
          modules=`python3 tools/update_modules_check/update_modules_check.py cv2-e2e "$update_files"`
          echo $modules
          echo "modules=$modules" >> $GITHUB_OUTPUT

      - name: Check Engine Update
        id: engine-modules
        if: ${{ steps.filter.outputs.engine == 'true' }}
        run: |
          update_files='${{ steps.filter.outputs.engine_files }}'
          modules=`python3 tools/update_modules_check/update_modules_check.py engine "$update_files"`
          echo $modules
          echo "modules=$modules" >> $GITHUB_OUTPUT

      - name: Check Engine E2E Update
        id: engine-e2e-modules
        if: ${{ steps.filter.outputs.engine-e2e == 'true' }}
        run: |
          update_files='${{ steps.filter.outputs.engine-e2e_files }}'
          modules=`python3 tools/update_modules_check/update_modules_check.py engine-e2e "$update_files"`
          echo $modules
          echo "modules=$modules" >> $GITHUB_OUTPUT

      - name: Check Deleted Modules
        id: deleted-modules
        if: ${{ steps.filter.outputs.deleted-poms == 'true' }}
        run: |
          update_files='${{ steps.filter.outputs.deleted-poms_files }}'
          modules=`python3 tools/update_modules_check/update_modules_check.py delete "$update_files"`
          echo $modules
          echo "modules=$modules" >> $GITHUB_OUTPUT  

      - name: Build Project
        id: build-project
        run: |
          ./mvnw -U --settings maven-settings.xml -T 1C clean install -DskipTests -D"maven.test.skip"=true -D"maven.javadoc.skip"=true

      - name: Make unit test modules
        id: ut-modules
        timeout-minutes: 100
        if: ${{ steps.filter.outputs.api == 'false' && (steps.engine-modules.outputs.modules != '' || steps.cv2-modules.outputs.modules != '') }}
        run: |
          modules='${{ steps.engine-modules.outputs.modules }}${{ steps.cv2-modules.outputs.modules }}'
          modules=${modules: 1}
          pl_modules=`python3 tools/update_modules_check/update_modules_check.py replace "$modules"`
          # remove deleted modules
          delete_modules='${{ steps.deleted-modules.outputs.modules }}'
          if [[ "zz"$delete_modules != "zz" ]];then
            pl_modules=`python3 tools/update_modules_check/update_modules_check.py rm "$pl_modules" "$delete_modules"`
          fi

          if [[ "zz"$pl_modules == "zz" ]];then
            exit 0
          fi
          timestamp='${{ steps.job-timestamp.outputs.timestamp }}'
          ./mvnw help:evaluate --settings maven-settings.xml -Dexpression=project.modules -q -DforceStdout -pl $pl_modules > /tmp/${timestamp}_sub_module_change.txt
          sub_modules=`python3 tools/update_modules_check/update_modules_check.py sub /tmp/${timestamp}_sub_module_change.txt`
          tree_modules="$modules$sub_modules"
          includes=`python3 tools/update_modules_check/update_modules_check.py tree "$tree_modules"`
          ./mvnw --settings maven-settings.xml -Pci -D"e2e.dependency.skip"=false  dependency:tree $includes -DoutputType=text -DoutputFile=/tmp/${timestamp}_tree_out.txt
          build_modules=`python3 tools/update_modules_check/update_modules_check.py final_ut /tmp/${timestamp}_tree_out.txt`
          if [[ "zz"$build_modules == "zz" ]];then
            build_modules=$pl_modules
          fi 
          echo $build_modules
          echo "modules=$build_modules" >> $GITHUB_OUTPUT

      - name: Make integration test modules
        id: it-modules
        timeout-minutes: 100
        if: ${{ steps.filter.outputs.api == 'false' && (steps.engine-modules.outputs.modules != '' || steps.cv2-modules.outputs.modules != '' || steps.cv2-e2e-modules.outputs.modules != '' || steps.cv2-flink-e2e-modules.outputs.modules != '' || steps.cv2-spark-e2e-modules.outputs.modules != '' || steps.engine-e2e-modules.outputs.modules != '') }}
        run: |
          modules='${{ steps.cv2-e2e-modules.outputs.modules }}${{ steps.cv2-flink-e2e-modules.outputs.modules }}${{ steps.cv2-spark-e2e-modules.outputs.modules }}${{ steps.engine-e2e-modules.outputs.modules }}${{ steps.engine-modules.outputs.modules }}${{ steps.cv2-modules.outputs.modules }}'
          modules=${modules: 1}
          pl_modules=`python3 tools/update_modules_check/update_modules_check.py replace "$modules"`
          # remove deleted modules
          delete_modules='${{ steps.deleted-modules.outputs.modules }}'
          if [[ "zz"$delete_modules != "zz" ]];then
            pl_modules=`python3 tools/update_modules_check/update_modules_check.py rm "$pl_modules" "$delete_modules"`
          fi
          
          if [[ "zz"$pl_modules == "zz" ]];then
            exit 0
          fi
          timestamp='${{ steps.job-timestamp.outputs.timestamp }}'
          ./mvnw --settings maven-settings.xml help:evaluate -Dexpression=project.modules -q -DforceStdout -pl $pl_modules > /tmp/${timestamp}_sub_module_it.txt
          sub_modules=`python3 tools/update_modules_check/update_modules_check.py sub /tmp/${timestamp}_sub_module_it.txt`
          tree_modules="$modules$sub_modules"
          includes=`python3 tools/update_modules_check/update_modules_check.py tree "$tree_modules"`
          ./mvnw --settings maven-settings.xml -Pci -D"e2e.dependency.skip"=false  dependency:tree $includes -DoutputType=text -DoutputFile=/tmp/${timestamp}_tree_out.txt
          build_modules=`python3 tools/update_modules_check/update_modules_check.py final_it /tmp/${timestamp}_tree_out.txt`
          echo $build_modules
          echo "modules=$build_modules" >> $GITHUB_OUTPUT

  unit-test:
    needs: [ changes, sanity-check ]
    if: needs.changes.outputs.api == 'true' || (needs.changes.outputs.api == 'false' && needs.changes.outputs.ut-modules != '')
    runs-on:
      labels: wtci
    strategy:
      matrix:
        os: [ 'self-hosted' ]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v2
      - name: run all modules unit test
        run: |
          ./mvnw -B --settings maven-settings.xml -T 1 clean verify -D"maven.test.skip"=false -D"license.skipAddThirdParty"=true --no-snapshot-updates
        env:
          MAVEN_OPTS: -Xmx4096m

  updated-modules-integration-test-part-1:
    needs: [ changes, sanity-check ]
    if: needs.changes.outputs.api == 'false' && needs.changes.outputs.it-modules != ''
    runs-on:
      labels: wtci
    strategy:
      matrix:
        os: [ 'self-hosted' ]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v2
      - name: run updated modules integration test (part-1)
        if: needs.changes.outputs.api == 'false' && needs.changes.outputs.it-modules != ''
        run: |
          sub_modules=`python3 tools/update_modules_check/update_modules_check.py sub_update_it_module ${{needs.changes.outputs.it-modules}} 5 0`
          if [ ! -z $sub_modules ]; then
            ./mvnw --settings maven-settings.xml -T 1 -B verify -DskipUT=true -DskipIT=false -D"license.skipAddThirdParty"=true --no-snapshot-updates -pl $sub_modules -am -Pci
          else
            echo "sub modules is empty, skipping"
          fi
        env:
          MAVEN_OPTS: -Xmx2048m

