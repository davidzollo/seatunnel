      - uses: actions/checkout@v2
      - name: run seatunnel zeta integration test
        if: needs.changes.outputs.api == 'true'
        run: |
          ./mvnw --settings maven-settings.xml -T 1 -B verify -DskipUT=true -DskipIT=false -D"license.skipAddThirdParty"=true --no-snapshot-updates -pl :connector-seatunnel-e2e-base,:connector-console-seatunnel-e2e -am -Pci
