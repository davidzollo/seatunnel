  engine-v2-it:
    needs: [ changes, sanity-check ]
    if: needs.changes.outputs.api == 'true'
    runs-on:
      labels: wtci
    strategy:
      matrix:
        os: [ 'self-hosted' ]
    timeout-minutes: 180
