          timestamp='${{needs.changes.outputs.timestamp}}'
          ./mvnw --settings maven-settings.xml help:evaluate -Dexpression=project.modules -q -DforceStdout -pl :seatunnel-connector-v2-e2e > /tmp/${timestamp}_sub_module_all_1.txt
          sub_modules=`python3 tools/update_modules_check/update_modules_check.py sub /tmp/${timestamp}_sub_module_all_1.txt`
