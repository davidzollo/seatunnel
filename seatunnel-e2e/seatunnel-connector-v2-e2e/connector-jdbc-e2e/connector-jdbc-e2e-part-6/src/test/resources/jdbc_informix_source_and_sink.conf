env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  jdbc {
    url = "jdbc:informix-sqli://informix-e2e:9088/seatunnel:INFORMIXSERVER=informix"
    driver = "com.informix.jdbc.IfxDriver"
    connection_check_timeout_sec = 100
    user = "informix"
    password = "in4mix"

    query = "select * from source;"
    properties {
      IFXHOST = "informix-e2e"
      DBSPACETEMP = "temp"
      CLIENT_LOCALE = "en_US.utf8"
      DB_LOCALE = "en_US.utf8"
      IFX_USEPUT = "1"
    }
  }
}

transform {
}

sink {
  jdbc {
    url = "jdbc:informix-sqli://informix-e2e:9088/seatunnel:INFORMIXSERVER=informix"
    driver = "com.informix.jdbc.IfxDriver"
    user = "informix"
    password = "in4mix"

    query = """insert into sink (c_serial, c_bigserial, c_int, c_bigint, c_smallint,
                                 c_decimal, c_decimal_high_precision, c_money, 
                                 c_float, c_real, c_double_precision,
                                 c_char, c_varchar, c_lvarchar, c_nchar, c_nvarchar,
                                 c_text, c_clob, c_date, c_datetime_year_to_second, 
                                 c_datetime_hour_to_minute, c_interval_day_to_hour,
                                 c_boolean, c_byte, c_blob)
               values (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?);"""
    properties {
      IFXHOST = "informix-e2e"
      DBSPACETEMP = "temp"
      CLIENT_LOCALE = "en_US.utf8"
      DB_LOCALE = "en_US.utf8"
      IFX_USEPUT = "1"
    }
  }
} 