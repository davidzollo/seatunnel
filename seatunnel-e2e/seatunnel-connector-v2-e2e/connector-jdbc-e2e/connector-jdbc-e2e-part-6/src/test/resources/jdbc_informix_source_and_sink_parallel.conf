env {
  parallelism = 2
  job.mode = "BATCH"
}

source {
  jdbc {
    url = "jdbc:informix-sqli://informix-e2e:9088/seatunnel:INFORMIXSERVER=informix"
    driver = "com.informix.jdbc.IfxDriver"
    connection_check_timeout_sec = 100
    user = "informix"
    password = "in4mix"

    table_path = "source"
    where_condition = "c_serial is not null"
    split.size = 1000
    split.sample-sharding-threshold = 1000
    partition_column = "c_serial"
    partition_lower_bound = 1
    partition_upper_bound = 3
    partition_num = 2
    
    properties {
      IFXHOST = "informix-e2e"
      DBSPACETEMP = "temp"
      CLIENT_LOCALE = "en_US.utf8"
      DB_LOCALE = "en_US.utf8"
      IFX_USEPUT = "1"
    }
  }
}

transform {
}

sink {
  jdbc {
    url = "jdbc:informix-sqli://informix-e2e:9088/seatunnel:INFORMIXSERVER=informix"
    driver = "com.informix.jdbc.IfxDriver"
    user = "informix"
    password = "in4mix"

    table_path = "sink"
    database = "seatunnel"
    
    properties {
      IFXHOST = "informix-e2e"
      DBSPACETEMP = "temp"
      CLIENT_LOCALE = "en_US.utf8"
      DB_LOCALE = "en_US.utf8"
      IFX_USEPUT = "1"
    }
  }
} 