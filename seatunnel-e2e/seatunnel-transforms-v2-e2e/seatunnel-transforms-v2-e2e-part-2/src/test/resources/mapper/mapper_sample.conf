######
###### This config file is a demonstration of streaming processing in seatunnel config
######

env {
  parallelism = 1
  job.mode = "BATCH"
  checkpoint.interval = 10000
}

source {
  FakeSource {
    result_table_name = "fake"
    schema = {
      table = "large_data_table"
      fields {
        id = "int"
        name = "string"
        price = "double"
      }
    }
    rows = [
      {fields = [1, "Joy Ding", 134.22], kind = INSERT}
    ]
  }
}

transform {
	Mapper {
	    specific=[
	        {
	            "input_name"="large_data_table"
	            "output_name"="large_data_table_test"
	            columns=[
	                {
	                    position=1
	                    "input_name"="name"
	                    "output_name"="name1"
	                    length=0
	                    scale=0
	                    "nullable"=false
	                    sqlFunction="UPPER(name)"
	                    action=MODIFY
	                }
	            ]
	            "primary_key" {
	                name=PRIMARY
	                columns=[
	                    {
	                        "reference_name"=id
	                        "sort_type"=ASC
	                    }
	                ]
	                action=MODIFY
	            }
	            indexes=[]
	            comment {
	                content="large_data_table_test"
	                action=MODIFY
	            }
	        }
	    ]
        source_table_name = "fake"
        result_table_name = "fake1"
	}
}

sink {
  Assert {
    source_table_name = "fake1"
    rules = {
      field_rules = [
        {
          field_name = "id"
          field_type = "int"
          field_value = [
            {equals_to = 1}
          ]
        },
        {
          field_name = "name1"
          field_type = "string"
          field_value = [
            {equals_to = "JOY DING"}
          ]
        },
        {
          field_name = "price"
          field_type = "double"
          field_value = [
            {equals_to = 134.22}
          ]
        }
      ]
    }
  }
}